# Reusable: run the Claude code-review plugin on a PR. Called by each repo's
# thin claude-code-review.yml wrapper so the pinned action SHA and the steps
# live in one place. The pull_request trigger stays in the callers.
name: claude-code-review-action (reusable)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    # Self-hosted nix runner pool (no GitHub Actions minutes; the Claude API
    # is billed to CLAUDE_CODE_OAUTH_TOKEN, not GitHub).
    runs-on: [self-hosted, nix, x86_64-linux]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The nixos/nix runner is non-FHS, so the generic bun + Claude Code the
      # action would download can't run. Build them (plus ripgrep + gh that
      # Claude Code shells out to) from the flake registry's current nixpkgs —
      # the same one the lint jobs use, already warm in the shared store and
      # patchelf'd for NixOS — and pass path_to_bun_executable /
      # path_to_claude_code_executable so the action skips its own installers.
      # git is already on PATH.
      - name: Provision bun + Claude Code + tools via nix
        id: nixtools
        shell: bash
        run: |
          set -euo pipefail
          bun=$(nix --accept-flake-config build --no-link --print-out-paths nixpkgs#bun)
          rg=$(nix --accept-flake-config build --no-link --print-out-paths nixpkgs#ripgrep)
          gh=$(nix --accept-flake-config build --no-link --print-out-paths nixpkgs#gh)
          claude=$(NIXPKGS_ALLOW_UNFREE=1 nix --accept-flake-config build --impure --no-link --print-out-paths nixpkgs#claude-code)
          printf '%s\n' "$bun/bin" "$rg/bin" "$gh/bin" >> "$GITHUB_PATH"
          echo "bun=$bun/bin/bun" >> "$GITHUB_OUTPUT"
          echo "claude=$claude/bin/claude" >> "$GITHUB_OUTPUT"

      # v1.0.139 passes --tsconfig-override to bun in its "post buffered
      # inline comments" step, which trips a Bun runtime bug ("Internal
      # error: directory mismatch for directory .../tsconfig.json"). On
      # self-hosted runners this does not fail the job -- it corrupts that
      # step's filesystem view just enough that it can't read back the
      # comments buffer, so the run reports is_error: false, does real
      # review work, and silently posts nothing ("No buffered inline
      # comments"). v1.0.207 drops --tsconfig-override entirely (see that
      # release's action.yml). Root-caused via this repo's own PRs
      # #170/#171/#172, all silently empty despite real turns and real cost
      # under the old pin, plus the same bug independently found and worked
      # around by a downstream consumer on a different runner/action-tag
      # combination without it ever getting reported back here.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1.0.207
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.nixtools.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.nixtools.outputs.claude }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
