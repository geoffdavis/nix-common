# Reusable: weekly `nix flake update` auto-PR. Called by each repo's thin
# update-flake-lock.yml wrapper so the pinned action SHA and the steps live in
# one place (bump here, not in four repos). Triggers stay in the callers.
#
# Note: PRs opened by the default GITHUB_TOKEN do not trigger downstream
# workflows (GitHub anti-recursion feature), which leaves bump PRs BLOCKED
# when branch protection requires lint / flake-check. The BOT_PAT secret (a
# fine-grained PAT with contents + pull-requests write) makes the PR come
# from a user token so CI fires normally. All four consumers set it, so
# `require-bot-pat` (default true) refuses to run without a WORKING one: a
# missing, rejected or expired token would otherwise fall back to
# GITHUB_TOKEN silently and leave a bump PR whose required checks never
# start (and that nobody notices until a merge is blocked). A token that
# works but expires within 14 days still lets the bump through, then fails
# the run at the end, so the failure email arrives before the token dies.
# Callers that deliberately run without BOT_PAT set require-bot-pat: false
# and get the GITHUB_TOKEN fallback (and the close-and-reopen dance).
name: update-flake-lock-action (reusable)

on:
  workflow_call:
    inputs:
      flake-inputs:
        description: >-
          Space-separated flake inputs to update. Empty (the default) updates
          all inputs. Repos with private git+ssh inputs, or with a nix-common
          rev that must go through `task bump:common`, list only their public
          inputs here.
        type: string
        default: ""
      branch:
        description: >-
          Branch the bump PR is opened from. Matches the action's own default;
          only override it if a repo already uses a different bump branch.
        type: string
        default: update_flake_lock_action
      resync-ci-pin:
        description: >-
          Run nix-common's `sync-pin` against the bump branch and fold any
          workflow pin change into the same PR. `update-flake-lock` only
          touches flake.lock, so repos whose workflows carry an `@<sha>` pin
          on a nix-common reusable workflow (ci.yml, and this caller's own
          update-flake-lock.yml) need this or their verify-pin job fails
          closed on every weekly bump. The name predates sync-pin walking
          every workflow; kept for caller compatibility.
        type: boolean
        default: false
      require-bot-pat:
        description: >-
          Fail (before touching the bump PR) unless BOT_PAT is set and
          accepted by GitHub, and fail the run at the end when it expires
          within 14 days. false restores the silent GITHUB_TOKEN fallback.
        type: boolean
        default: true
    secrets:
      BOT_PAT:
        description: >-
          Fine-grained PAT with contents + pull-requests write. Required
          unless require-bot-pat is false (then it falls back to
          GITHUB_TOKEN; see header).
        required: false

jobs:
  update:
    # Self-hosted nix runner pool; Nix already present (no installer step).
    runs-on: [self-hosted, nix, x86_64-linux]
    permissions:
      contents: write
      pull-requests: write
    steps:
      # First, so a dead token stops the run before the bump PR is touched.
      # The token reaches curl on stdin (-K -), never argv; Actions masks it
      # in logs regardless.
      - name: Check BOT_PAT
        id: botpat
        if: inputs.require-bot-pat
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_PAT" ]; then
            echo "::error::BOT_PAT is not set: the bump PR would come from GITHUB_TOKEN and its required checks would never start. Add the secret, or set require-bot-pat: false."
            exit 1
          fi
          hdrs=$(mktemp)
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$BOT_PAT" \
            | curl -sS -K - --max-time 30 -o /dev/null -D "$hdrs" -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO") || code=000
          if [ "$code" != 200 ]; then
            echo "::error::BOT_PAT was rejected for $REPO (HTTP $code): expired, revoked, or not granted this repo. Regenerate it (contents + pull-requests write) and update the secret."
            exit 1
          fi
          # Fine-grained and expiring classic tokens report their expiry;
          # a non-expiring classic token has no such header.
          expires=$(sed -n 's/^github-authentication-token-expiration: *//Ip' "$hdrs" | tr -d '\r')
          echo "expires=$expires" >>"$GITHUB_OUTPUT"
          echo "BOT_PAT accepted for $REPO; expires: ${expires:-never}"

      # Pinned to immutable commit SHAs; comments name the tag the SHA
      # was resolved from so dependabot / a human can bump intentionally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the resync path needs persisted push credentials on the bump
          # branch (BOT_PAT so that push triggers CI). Without resync — or
          # without BOT_PAT — this resolves to github.token, which is exactly
          # checkout's own default, so non-resync callers are unaffected.
          token: ${{ (inputs.resync-ci-pin && secrets.BOT_PAT) || github.token }}

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ secrets.BOT_PAT || github.token }}
          # Empty string is the action's default and means "update all".
          inputs: ${{ inputs.flake-inputs }}
          branch: ${{ inputs.branch }}
          pr-labels: |
            dependencies
            automated

      # sync-pin rewrites every workflow under .github/workflows/, not just
      # ci.yml — commit the whole directory, or verify-pin (which checks
      # them all) fails on the pin this step silently dropped.
      - name: Resync workflow pins
        if: inputs.resync-ci-pin && steps.update.outputs.pull-request-number
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -eu
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          nix run github:geoffdavis/nix-common#sync-pin
          if git diff --quiet -- .github/workflows; then
            echo "workflow pins already in sync with flake.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: resync nix-common workflow pins from flake.lock" \
            -- .github/workflows
          git push origin "$BRANCH"

      # Last, so a nearly-expired (still working) token lets this week's bump
      # through but turns the run red -- the failure email is the warning.
      - name: BOT_PAT expiry
        if: always() && steps.botpat.outputs.expires != ''
        env:
          EXPIRES: ${{ steps.botpat.outputs.expires }}
        run: |
          set -euo pipefail
          left=$(( ($(date -d "$EXPIRES" +%s) - $(date +%s)) / 86400 ))
          if [ "$left" -lt 14 ]; then
            echo "::error::BOT_PAT expires in $left day(s) ($EXPIRES). Regenerate it and update the secret in every repo that uses it."
            exit 1
          fi
          echo "BOT_PAT expires in $left days ($EXPIRES)"
