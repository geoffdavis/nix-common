# Weekly auto-PR that runs `nix flake update` and opens a pull request.
# Trigger an ad-hoc bump from the Actions tab or via:
#   gh workflow run update-flake-lock.yml
#
# Thin wrapper: the steps and the pinned action SHA live in the reusable
# update-flake-lock-action.yml alongside this file. Triggers, top-level
# permissions and the repo-specific inputs stay here.

name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Mondays at 07:00 UTC — fresh PR at start of week.
    - cron: "0 7 * * 1"

# Granted at the caller so the reusable workflow's job permissions are within
# the token's cap.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/update-flake-lock-action.yml
    secrets: inherit
